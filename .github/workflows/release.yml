name: Release

on:
  push:
    tags: ["v*"]

env:
  TOKEI_VERSION: "14.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + MCP Registry OIDC login
      contents: write # create the GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # tokei is a runtime dependency (get_line_counts, check_thresholds) and its
      # tests shell out to the real binary. No prebuilt binaries exist past
      # v12.1.2, so build the pinned version from crates.io.
      - name: Cache tokei binary
        id: cache-tokei
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tokei
          key: tokei-${{ runner.os }}-${{ env.TOKEI_VERSION }}

      - name: Install tokei
        if: steps.cache-tokei.outputs.cache-hit != 'true'
        run: cargo install tokei --version "$TOKEI_VERSION" --locked

      - name: Install dependencies
        run: npm ci

      # Must come after npm ci: npm 12 blocks dependency install scripts by
      # default, which leaves tree-sitter without its native binding. Trusted
      # publishing (OIDC) needs npm >= 11.5.1 and Node 22 ships npm 10.x, so the
      # upgrade happens once the install is done. Pinned to a major rather than
      # @latest so a future npm dropping Node 22 cannot break the release.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^12

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # Auth comes from OIDC via the id-token permission — no NODE_AUTH_TOKEN.
      # Provenance is generated automatically, so --provenance is not passed.
      # prepublishOnly runs check + tests + build before publishing.
      - name: Publish to npm
        run: npm publish --access public

      - name: Sync version into server.json and manifest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Build .mcpb bundle
        run: |
          npm prune --omit=dev
          npm run bundle:mcpb

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" scopewalker-mcp.mcpb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
